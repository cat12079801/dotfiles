# GitHub 向けの SSH 設定。公開リポジトリで管理するため、ホスト名・ユーザ名・
# 鍵の場所といった環境固有の情報は置かない。それらは管理外の ~/.ssh/config に残す。
#
# ~/.ssh/config の `Include ~/.ssh/config.d/*.conf` から読まれる。
# SSH はキーワードごとに先勝ちでマージするため、~/.ssh/config 側の
# HostName / User / IdentityFile 等とは競合しない。

Host github github.com
  # SSH の接続確立に約 3 秒かかるため、接続を多重化して使い回す。
  # 実測: git fetch 4.0 秒 → 0.06 秒。
  #
  # ControlPath の親ディレクトリは ssh が自動作成しないので、
  # mise.toml の [bootstrap.directories] で用意している。
  # %C を使うのは、ソケットのパス長上限（macOS で 104 バイト）を超えないため。
  # %r@%h:%p を素で書くとホスト名が長い環境で超過して接続できなくなる。
  ControlMaster auto
  ControlPath ~/.ssh/cm/%C
  ControlPersist 10m

  # スリープ復帰や VPN 切り替えでマスター接続の TCP が死ぬと、相乗りした
  # コマンドが応答待ちで固まる。約 45 秒で検知してマスターを終了させる。
  ServerAliveInterval 15
  ServerAliveCountMax 3
