# dotfiles のデプロイ定義。
# 適用: cd ~/dotfiles && mise bootstrap dotfiles apply
# 確認: mise bootstrap dotfiles status / --dry-run
#
# 初回のみ `mise trust` が必要。

[settings]
dotfiles.root = "~/dotfiles"
dotfiles.default_mode = "symlink"

# 本 dotfiles が動作するために必要なパッケージ。
# いずれも設定ファイルから直接参照されており、欠けると起動時エラーになる。
#   fish/starship … config.fish が起動時に呼ぶ
#   tmux          … tmux.conf
#   neovim        … config/nvim、alias vim=nvim
#   git-delta     … gitconfig の core.pager
#   lsd           … config.fish の alias ls
#   fzf           … fisher の jethrokuan/fzf、alias gsf
#   gh            … gitconfig の credential helper
#   gwq           … git worktree 管理 CLI
[bootstrap.packages]
"brew:fish"      = "latest"
"brew:starship"  = "latest"
"brew:tmux"      = "latest"
"brew:neovim"    = "latest"
"brew:git-delta" = "latest"
"brew:lsd"       = "latest"
"brew:fzf"       = "latest"
"brew:gh"        = "latest"
"brew:d-kuro/tap/gwq" = "latest"

# gwq は本家 formula が無く tap から取得する。
[bootstrap.brew.taps]
"d-kuro/tap" = "https://github.com/d-kuro/homebrew-tap.git"

# tmux のプラグインマネージャ。tmux.conf 末尾の `run '~/.tmux/plugins/tpm/tpm'`
# が参照するため、これが無いと tmux のプラグインが一切読み込まれない。
[bootstrap.repos]
"~/.tmux/plugins/tpm" = { url = "https://github.com/tmux-plugins/tpm" }

[dotfiles]
"~/.gitconfig" = "gitconfig"
"~/.tmux.conf" = "tmux.conf"
"~/.ideavimrc" = "ideavimrc"

# 対話シェルは fish のみ。zsh を置くのはエージェントのツール実行が
# zsh で走るためで、そこでも safe-chain を効かせる目的である。
# bash は対話利用も他ツールからの利用も無いため管理しない。
"~/.zshrc" = "zshrc"

# SSH 設定は断片のみを管理する。~/.ssh/config 本体は管理外に置く。
# 業務・顧客のホスト名や踏み台の情報が公開リポジトリへ載る経路を作らないため、
# および config を書き換えるツールがリポジトリを汚すのを避けるため。
"~/.ssh/config.d/github.conf" = "ssh/github.conf"

"~/.config/git"           = "config/git"
"~/.config/gwq"           = "config/gwq"
"~/.config/nvim"          = "config/nvim"
"~/.config/starship.toml" = "config/starship.toml"

# fish はディレクトリごとリンクしない。fisher や fish 自身が
# completions/ conf.d/ fish_variables を書き込むため、ディレクトリ
# リンクにするとそれらがリポジトリへ流入する。symlink-each なら
# 実ディレクトリを作ったうえで管理下のファイルのみをリンクするため、
# 生成物は ~/.config/fish 側に留まる。
"~/.config/fish" = { source = "config/fish", mode = "symlink-each" }

# `mise bootstrap` の最後に実行される。brew で入らない依存を揃える。
[tasks.bootstrap]
description = "safe-chain と fisher を導入し fish プラグインを同期する"
run = '''
# --- ssh --------------------------------------------------------------
# ControlPath 用のソケット置き場。ssh は親ディレクトリを自動作成しない。
# 認証済み接続を共有するソケットなので 700 に絞る。
# [bootstrap.directories] を使わないのは、$HOME 配下であっても
# システム領域の変更とみなされ sudo を要求されるためである。
mkdir -p ~/.ssh/cm
chmod 700 ~/.ssh/cm

# --- safe-chain ---------------------------------------------------------
# npm / npx / yarn 等をラップして検査を挟むツール。brew formula が無いため
# 公式インストーラを使う。
#
# バージョンは固定する。latest を使うと以下の問題がある。
#   - インストーラはバイナリの SHA256 を検証するが、期待値はスクリプト自身に
#     埋め込まれているため、スクリプトが改竄されれば検証は無力になる。
#     スクリプトのハッシュを外から照合して初めて意味のある検証になる
#   - 何が入ったかが git 履歴に残らず、不具合時に戻せない
# 脅威情報は実行時に malware-list.aikido.dev から取得されるため、
# 版を固定しても検知能力は落ちない。更新は本ファイルの版とハッシュを
# 書き換えるコミットとして行う。
#
# インストーラは最後に `safe-chain setup` を走らせる。setup は $HOME 配下の
# シェル設定を書き換え、既存の読み込み行を末尾へ移動する（上流にも .zshrc を
# 上書きする不具合報告がある）。config.fish と zshrc はリポジトリへの symlink
# であるため、これを許すとリポジトリが汚れる。よって使い捨ての HOME を与えて
# setup の書き込みを隔離し、バイナリのみを --install-dir に配置する。
# シェルへの配線は config.fish と zshrc が管理する。
set -l sc_version 1.5.15
set -l sc_sha256 de0565e3d6346407a604e84e639e95fea8758748063da2216bbfdca5feda5dd2

set -l sc_current
if test -x ~/.safe-chain/bin/safe-chain
  set sc_current (~/.safe-chain/bin/safe-chain --version 2>/dev/null |
    string match -rg '([0-9]+\.[0-9]+\.[0-9]+)')
end

if test "$sc_current" != "$sc_version"
  set -l tmp (mktemp -d)
  curl -fsSL "https://github.com/AikidoSec/safe-chain/releases/download/$sc_version/install-safe-chain.sh" \
    -o $tmp/install.sh

  set -l actual
  if command -q shasum
    set actual (shasum -a 256 $tmp/install.sh | awk '{print $1}')
  else
    set actual (sha256sum $tmp/install.sh | awk '{print $1}')
  end

  if test "$actual" != "$sc_sha256"
    echo "safe-chain: インストーラのハッシュが一致しないため中止する" >&2
    echo "  expected: $sc_sha256" >&2
    echo "  actual:   $actual" >&2
    rm -rf $tmp
    exit 1
  end

  echo "safe-chain: $sc_version を導入する（現在: "(test -n "$sc_current"; and echo $sc_current; or echo なし)"）"
  env HOME=$tmp sh $tmp/install.sh --install-dir $HOME/.safe-chain
  rm -rf $tmp
end

# --- gwq ----------------------------------------------------------------
# 生成物なのでリポジトリではなく ~/.config/fish 側へ出す。
#
# 出力先は completions/ ではなく conf.d/ である。cd.launch_shell = false の
# とき、この出力には `gwq cd` を現在のシェルで動かす `function gwq` ラッパーが
# 含まれる。completions/ は補完要求時にしか読まれずラッパーが定義されないため、
# 起動時に読まれる conf.d/ でなければ `gwq cd` が動かない。
#
# ラッパーは生成時点の cd.launch_shell を見て出力が変わる。[dotfiles] の適用は
# 本タスクより前に走るため、設定が反映された状態で生成される。
if command -q gwq
  gwq completion fish > ~/.config/fish/conf.d/gwq.fish
end

# --- fisher -------------------------------------------------------------
# fish_plugins に列挙したプラグインを導入するため、その前提を用意する。
if not functions -q fisher
  curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source
  fisher install jorgebucaran/fisher
end
fisher update
'''
shell = "fish -c"
