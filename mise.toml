# dotfiles のデプロイ定義。
# 適用: cd ~/dotfiles && mise bootstrap dotfiles apply
# 確認: mise bootstrap dotfiles status / --dry-run
#
# 初回のみ `mise trust` が必要。

[settings]
dotfiles.root = "~/dotfiles"
dotfiles.default_mode = "symlink"

# 本 dotfiles が動作するために必要なパッケージ。
# いずれも設定ファイルから直接参照されており、欠けると起動時エラーになる。
#   fish/starship … config.fish が起動時に呼ぶ
#   tmux          … tmux.conf
#   neovim        … config/nvim、alias vim=nvim
#   git-delta     … gitconfig の core.pager
#   lsd           … config.fish の alias ls
#   fzf           … fisher の jethrokuan/fzf、alias gsf
#   gh            … gitconfig の credential helper
[bootstrap.packages]
"brew:fish"      = "latest"
"brew:starship"  = "latest"
"brew:tmux"      = "latest"
"brew:neovim"    = "latest"
"brew:git-delta" = "latest"
"brew:lsd"       = "latest"
"brew:fzf"       = "latest"
"brew:gh"        = "latest"

# tmux のプラグインマネージャ。tmux.conf 末尾の `run '~/.tmux/plugins/tpm/tpm'`
# が参照するため、これが無いと tmux のプラグインが一切読み込まれない。
[bootstrap.repos]
"~/.tmux/plugins/tpm" = { url = "https://github.com/tmux-plugins/tpm" }

[dotfiles]
"~/.gitconfig" = "gitconfig"
"~/.bashrc"    = "bashrc"
"~/.tmux.conf" = "tmux.conf"
"~/.ideavimrc" = "ideavimrc"

"~/.config/git"           = "config/git"
"~/.config/nvim"          = "config/nvim"
"~/.config/starship.toml" = "config/starship.toml"

# fish はディレクトリごとリンクしない。fisher や fish 自身が
# completions/ conf.d/ fish_variables を書き込むため、ディレクトリ
# リンクにするとそれらがリポジトリへ流入する。symlink-each なら
# 実ディレクトリを作ったうえで管理下のファイルのみをリンクするため、
# 生成物は ~/.config/fish 側に留まる。
"~/.config/fish" = { source = "config/fish", mode = "symlink-each" }

# `mise bootstrap` の最後に実行される。brew で入らない依存を揃える。
[tasks.bootstrap]
description = "safe-chain と fisher を導入し fish プラグインを同期する"
run = '''
# --- safe-chain ---------------------------------------------------------
# npm / npx / yarn 等をラップして検査を挟むツール。brew formula が無いため
# 公式インストーラを使う。バイナリのチェックサム検証はインストーラが行う。
#
# インストーラは最後に `safe-chain setup` を走らせ、$HOME 配下のシェル設定へ
# 読み込み行を追記する。config.fish はリポジトリへの symlink であるため、
# これを許すとリポジトリが書き換えられる（既存行を末尾へ移動する挙動を確認済み）。
# よって使い捨ての HOME を与えて setup の書き込みを隔離し、バイナリのみを
# --install-dir に配置する。シェルへの配線は config.fish が管理する。
if not test -x ~/.safe-chain/bin/safe-chain
  set -l throwaway (mktemp -d)
  curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh \
    | env HOME=$throwaway sh -s -- --install-dir $HOME/.safe-chain
  rm -rf $throwaway
end

# --- fisher -------------------------------------------------------------
# fish_plugins に列挙したプラグインを導入するため、その前提を用意する。
if not functions -q fisher
  curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source
  fisher install jorgebucaran/fisher
end
fisher update
'''
shell = "fish -c"
